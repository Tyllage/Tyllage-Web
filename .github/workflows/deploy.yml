name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Optional. Set as a repository variable once the enquiry API exists.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC → AWS IAM role; no long-lived AWS keys.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fingerprinted assets never change, so they can be cached for a year.
      - name: Upload hashed assets
        run: >
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --delete
          --cache-control "public, max-age=31536000, immutable"

      # Everything else (HTML, sitemap, images) is revalidated on each request.
      - name: Upload pages and public files
        run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude "assets/*"
          --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
